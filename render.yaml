# Render Blueprint for THE BIG CON (static site).
#
# NOTE: the live site is currently configured in the Render dashboard, so this
# file does nothing until you adopt it as a Blueprint (see README "Deploying on
# Render"). Schema checked against https://render.com/schema/render.yaml.json.
#
# `--include=dev` is there because esbuild is a devDependency and the build
# must not depend on whether Render sets NODE_ENV=production for the build.
services:
  - type: web
    runtime: static
    name: thebigcon            # must match the existing service name if you adopt it
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      # HTML (and the site root) must always revalidate so a deploy is picked up
      # immediately and points at the new hashed assets.
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
      # Every local .js/.css in dist/ is renamed name.<contenthash>.ext by
      # scripts/build.mjs, so they can be cached forever. Images are NOT hashed
      # and keep the default caching.
      - path: /**/*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /**/*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
