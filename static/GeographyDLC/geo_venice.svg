<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img" aria-label="VENICE DI CCTV">
  <!-- Venice: dark night-canal sign, matching the board's collage/node-card look -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1011"/>
      <stop offset="1" stop-color="#132527"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16403e"/>
      <stop offset="1" stop-color="#0d2a2a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sky)"/>
  <!-- campanile + terracotta skyline -->
  <g opacity=".88">
    <rect x="30" y="70" width="16" height="52" fill="#5e2f22"/>
    <polygon points="29,70 38,52 47,70" fill="#7a3a26"/>
    <rect x="36" y="44" width="4" height="9" fill="#b9814a"/>
    <rect x="60" y="84" width="26" height="38" fill="#4a2721"/>
    <polygon points="58,84 73,70 88,84" fill="#6d3524"/>
    <rect x="92" y="78" width="34" height="44" fill="#57301f"/>
    <polygon points="90,78 109,64 128,78" fill="#7a3a26"/>
    <rect x="132" y="88" width="24" height="34" fill="#45241d"/>
    <polygon points="130,88 144,76 158,88" fill="#6d3524"/>
    <!-- window lights -->
    <rect x="66" y="92" width="4" height="5" fill="#f5c542"/>
    <rect x="76" y="98" width="4" height="5" fill="#f5c542"/>
    <rect x="98" y="86" width="4" height="5" fill="#f5c542"/>
    <rect x="110" y="92" width="4" height="5" fill="#f5c542"/>
    <rect x="138" y="94" width="4" height="5" fill="#f5c542"/>
  </g>
  <!-- canal -->
  <rect y="122" width="300" height="78" fill="url(#water)"/>
  <!-- gondola -->
  <g>
    <path d="M96 152 Q150 164 196 150 Q202 149 208 146 Q198 158 186 158 Q152 166 116 160 Q104 158 96 152 Z" fill="#0c0c0c"/>
    <path d="M196 150 Q206 143 210 134 L212 136 Q208 146 200 152 Z" fill="#0c0c0c"/>
    <rect x="140" y="146" width="14" height="5" rx="2" fill="#b3241f"/>
    <circle cx="147" cy="141" r="3" fill="#b3241f"/>
    <!-- gondolier -->
    <circle cx="176" cy="134" r="5" fill="#0e0e0e"/>
    <rect x="171" y="138" width="9" height="14" rx="3" fill="#123"/>
  </g>
  <text x="150" y="114" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" letter-spacing="4" fill="#e8dcc3">VENICE</text>
  <text x="150" y="132" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="6" fill="#8fbfb9">DI CCTV</text>
  <text x="150" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" letter-spacing="1" fill="#c9b98c">la serenissima · sella aperta</text>
</svg>
